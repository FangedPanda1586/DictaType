name: Build Windows release - French v7 onedir

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DICTATYPE_PIPELINE_VERSION: "french-v7-onedir-native-runtime"
  FRENCH_VOICE_NAME: "fr_FR-siwis-medium"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show build pipeline version
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host "DictaType pipeline: $env:DICTATYPE_PIPELINE_VERSION"
          Write-Host "PyInstaller mode: ONEDIR for Piper/ONNX reliability"
          Write-Host "=============================================="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build DictaType one-folder runtime
        run: python -m PyInstaller --noconfirm --clean DictaType.spec

      - name: Inspect collected Piper runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "dist\DictaType\DictaType.exe")) {
            throw "ONEDIR build did not create dist\DictaType\DictaType.exe"
          }
          Write-Host "DictaType runtime tree (Piper/ONNX highlights):"
          Get-ChildItem "dist\DictaType" -Recurse -File |
            Where-Object { $_.FullName -match "piper|espeak|onnxruntime|onnxruntime_providers|espeakbridge" } |
            Select-Object FullName, Length

      - name: Stage French neural voice - mandatory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $downloadDir = Join-Path $PWD "voice-download"
          $releaseVoiceDir = Join-Path $PWD "dist\DictaType\voices"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          New-Item -ItemType Directory -Force -Path $releaseVoiceDir | Out-Null

          Write-Host "Downloading $env:FRENCH_VOICE_NAME with Piper's official downloader..."
          python -m piper.download_voices $env:FRENCH_VOICE_NAME --data-dir "$downloadDir"
          if ($LASTEXITCODE -ne 0) { throw "Piper voice downloader failed." }

          $sourceModel = Join-Path $downloadDir "$env:FRENCH_VOICE_NAME.onnx"
          $sourceConfig = Join-Path $downloadDir "$env:FRENCH_VOICE_NAME.onnx.json"
          $destModel = Join-Path $releaseVoiceDir "french.onnx"
          $destConfig = Join-Path $releaseVoiceDir "french.onnx.json"

          if (-not (Test-Path $sourceModel)) { throw "Piper did not create: $sourceModel" }
          if (-not (Test-Path $sourceConfig)) { throw "Piper did not create: $sourceConfig" }
          Copy-Item $sourceModel $destModel -Force
          Copy-Item $sourceConfig $destConfig -Force

          if ((Get-Item $destModel).Length -lt 50000000) { throw "French model is unexpectedly small." }
          python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8')); print('French config JSON validated with Python.')" "$destConfig"
          if ($LASTEXITCODE -ne 0) { throw "Python JSON validation failed." }

          Get-Item $destModel, $destConfig | Select-Object FullName, Length

      - name: Verify Piper with normal Python before frozen test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import wave
          from pathlib import Path
          from piper import PiperVoice

          model = Path(r"dist\DictaType\voices\french.onnx")
          out = Path("python-piper-verification.wav")
          voice = PiperVoice.load(str(model))
          with wave.open(str(out), "wb") as wav_file:
              voice.synthesize_wav("Bonjour. Ceci est un test de DictaType.", wav_file)
          if not out.exists() or out.stat().st_size <= 44:
              raise SystemExit("Python Piper synthesis did not create valid audio")
          print(f"Normal Python Piper synthesis OK: {out.stat().st_size} bytes")
          '@ | Set-Content -Encoding UTF8 verify_piper.py
          python verify_piper.py

      - name: Verify French neural voice inside finished EXE
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $report = Join-Path $PWD "french-voice-verification.json"
          Remove-Item $report -Force -ErrorAction SilentlyContinue

          & ".\dist\DictaType\DictaType.exe" --voice-dir ".\dist\DictaType\voices" --verify-french-voice --verification-output $report
          $exitCode = $LASTEXITCODE

          Write-Host "Finished EXE exit code: $exitCode"
          if (Test-Path $report) {
            Write-Host "----- French voice diagnostic report -----"
            Get-Content $report
            Write-Host "------------------------------------------"
          } else {
            Write-Host "No diagnostic JSON was produced. The frozen runtime likely failed before DictaType could write the report."
          }

          if ($exitCode -ne 0) {
            Write-Host "Piper/ONNX files collected in finished runtime:"
            Get-ChildItem "dist\DictaType" -Recurse -File |
              Where-Object { $_.FullName -match "piper|espeak|onnxruntime|onnxruntime_providers|espeakbridge" } |
              Select-Object FullName, Length
            exit $exitCode
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "dist\DictaType\DictaType.exe",
            "dist\DictaType\voices\french.onnx",
            "dist\DictaType\voices\french.onnx.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Installer input missing: $file" }
          }

          $candidatePaths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler ISCC.exe was not found." }

          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Verify installer was created
        shell: powershell
        run: |
          if (-not (Test-Path "installer-output\DictaType-Setup.exe")) { throw "Installer was not created." }
          Get-Item "installer-output\DictaType-Setup.exe" | Select-Object FullName, Length

      - name: Package portable build
        shell: powershell
        run: |
          if (-not (Test-Path "dist\DictaType\DictaType.exe")) { throw "Portable EXE is missing." }
          if (-not (Test-Path "dist\DictaType\voices\french.onnx")) { throw "Portable French model is missing." }
          if (-not (Test-Path "dist\DictaType\voices\french.onnx.json")) { throw "Portable French config is missing." }
          Compress-Archive -Path "dist\DictaType" -DestinationPath "DictaType-Portable-Windows.zip" -Force

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: DictaType-Windows
          path: |
            DictaType-Portable-Windows.zip
            installer-output/DictaType-Setup.exe
            french-voice-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DictaType-Portable-Windows.zip
            installer-output/DictaType-Setup.exe
