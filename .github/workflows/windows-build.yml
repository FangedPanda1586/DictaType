name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean DictaType.spec

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          $candidatePaths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )

          $iscc = $candidatePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) {
              $iscc = $command.Source
            }
          }

          if (-not $iscc) {
            throw "Inno Setup compiler ISCC.exe was not found after installation."
          }

          & $iscc "installer.iss"

      - name: Package portable build
        shell: powershell
        run: Compress-Archive -Path dist\DictaType.exe -DestinationPath DictaType-Portable-Windows.zip

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: DictaType-Windows
          path: |
            DictaType-Portable-Windows.zip
            installer_output/DictaType-Setup.exe
          if-no-files-found: error
          retention-days: 30
