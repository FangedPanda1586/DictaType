name: Build Windows release - French v6

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DICTATYPE_PIPELINE_VERSION: "french-v6-python-json-only"
  FRENCH_VOICE_NAME: "fr_FR-siwis-medium"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show build pipeline version
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host "DictaType pipeline: $env:DICTATYPE_PIPELINE_VERSION"
          Write-Host "This build MUST stage French audio before Inno Setup."
          Write-Host "=============================================="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean DictaType.spec

      - name: Stage French neural voice - mandatory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $downloadDir = Join-Path $PWD "voice-download"
          $releaseVoiceDir = Join-Path $PWD "dist\voices"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          New-Item -ItemType Directory -Force -Path $releaseVoiceDir | Out-Null

          Write-Host "Downloading $env:FRENCH_VOICE_NAME with Piper's official downloader..."
          python -m piper.download_voices $env:FRENCH_VOICE_NAME --data-dir "$downloadDir"
          if ($LASTEXITCODE -ne 0) {
            throw "Piper voice downloader failed with exit code $LASTEXITCODE."
          }

          $sourceModel = Join-Path $downloadDir "$env:FRENCH_VOICE_NAME.onnx"
          $sourceConfig = Join-Path $downloadDir "$env:FRENCH_VOICE_NAME.onnx.json"
          $destModel = Join-Path $releaseVoiceDir "french.onnx"
          $destConfig = Join-Path $releaseVoiceDir "french.onnx.json"

          if (-not (Test-Path $sourceModel)) { throw "Piper did not create: $sourceModel" }
          if (-not (Test-Path $sourceConfig)) { throw "Piper did not create: $sourceConfig" }

          Copy-Item $sourceModel $destModel -Force
          Copy-Item $sourceConfig $destConfig -Force

          $model = Get-Item $destModel
          $config = Get-Item $destConfig
          if ($model.Length -lt 50000000) {
            throw "French model is unexpectedly small: $($model.Length) bytes."
          }
          if ($config.Length -lt 500) {
            throw "French configuration is unexpectedly small: $($config.Length) bytes."
          }
          python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8')); print('French config JSON validated with Python.')" "$destConfig"
          if ($LASTEXITCODE -ne 0) { throw "Python JSON validation failed for $destConfig" }

          Write-Host "French neural voice staged successfully:"
          Get-Item $destModel, $destConfig | Select-Object FullName, Length
          Write-Host "Model SHA-256: $((Get-FileHash $destModel -Algorithm SHA256).Hash)"

      - name: Verify French release files before EXE test
        shell: powershell
        run: |
          $required = @(
            "dist\DictaType.exe",
            "dist\voices\french.onnx",
            "dist\voices\french.onnx.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required release file missing: $file" }
          }
          Get-Item $required | Select-Object FullName, Length

      - name: Verify French neural voice inside built EXE
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $report = Join-Path $PWD "french-voice-verification.json"
          & ".\dist\DictaType.exe" --voice-dir ".\dist\voices" --verify-french-voice --verification-output $report
          $exitCode = $LASTEXITCODE
          if (Test-Path $report) { Get-Content $report }
          if ($exitCode -ne 0) {
            throw "The finished DictaType.exe could not synthesize with the French neural voice."
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          # Self-healing guard. The installer is NEVER allowed to run without the voice.
          $voiceDir = Join-Path $PWD "dist\voices"
          $modelPath = Join-Path $voiceDir "french.onnx"
          $configPath = Join-Path $voiceDir "french.onnx.json"

          if ((-not (Test-Path $modelPath)) -or (-not (Test-Path $configPath))) {
            Write-Warning "French voice was missing immediately before installer build. Restaging it now."
            $fallbackDir = Join-Path $PWD "voice-download-installer-fallback"
            New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
            New-Item -ItemType Directory -Force -Path $voiceDir | Out-Null

            python -m piper.download_voices $env:FRENCH_VOICE_NAME --data-dir "$fallbackDir"
            if ($LASTEXITCODE -ne 0) { throw "Fallback Piper download failed." }

            Copy-Item (Join-Path $fallbackDir "$env:FRENCH_VOICE_NAME.onnx") $modelPath -Force
            Copy-Item (Join-Path $fallbackDir "$env:FRENCH_VOICE_NAME.onnx.json") $configPath -Force
          }

          if (-not (Test-Path $modelPath)) { throw "Installer model still missing: $modelPath" }
          if (-not (Test-Path $configPath)) { throw "Installer config still missing: $configPath" }
          if ((Get-Item $modelPath).Length -lt 50000000) { throw "Installer model is incomplete." }
          python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8')); print('Installer French config JSON validated with Python.')" "$configPath"
          if ($LASTEXITCODE -ne 0) { throw "Python JSON validation failed for $configPath" }

          Write-Host "Installer French voice inputs confirmed:"
          Get-Item $modelPath, $configPath | Select-Object FullName, Length

          $candidatePaths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler ISCC.exe was not found." }

          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Verify installer was created
        shell: powershell
        run: |
          if (-not (Test-Path "installer-output\DictaType-Setup.exe")) {
            throw "Installer was not created."
          }
          Get-Item "installer-output\DictaType-Setup.exe" | Select-Object FullName, Length

      - name: Package portable build
        shell: powershell
        run: |
          if (-not (Test-Path "dist\voices\french.onnx")) { throw "Portable package is missing french.onnx." }
          if (-not (Test-Path "dist\voices\french.onnx.json")) { throw "Portable package is missing french.onnx.json." }

          Remove-Item "portable" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "portable\DictaType" | Out-Null
          Copy-Item "dist\DictaType.exe" "portable\DictaType\DictaType.exe" -Force
          Copy-Item "dist\voices" "portable\DictaType\voices" -Recurse -Force
          Compress-Archive -Path "portable\DictaType" -DestinationPath "DictaType-Portable-Windows.zip" -Force

      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: DictaType-Windows
          path: |
            DictaType-Portable-Windows.zip
            installer-output/DictaType-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DictaType-Portable-Windows.zip
            installer-output/DictaType-Setup.exe
